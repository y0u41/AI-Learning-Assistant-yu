name: Deploy to GitHub Pages

# M5（Build.md §2.6）：push 主干自动部署 GitHub Pages；
# 构建传 --base=/AI-Learning-Assistant-yu/（仓库页为子路径，源码内资源引用均走 BASE_URL）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
# 注意：首次启用需在仓库 Settings → Pages → Source 选「GitHub Actions」（一次性；
# GITHUB_TOKEN 无 administration 权限，无法用 enablement 参数自动启用）

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/AI-Learning-Assistant-yu/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
